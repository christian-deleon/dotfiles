# profiles/wsl-work.yaml
# Work WSL2 Ubuntu — restricted toolset. Conservative defaults assuming corp
# policy restricts Docker / cloud SDKs. Drafted as a guess: review and adjust
# for your actual work-machine policy before committing.

name: wsl-work
description: Work WSL2 Ubuntu (restricted CLI dev toolset)

requires: [wsl]

core_extras:
  - git-config
  - ai-tool

# Bare-bones CLI essentials. No Docker, no kubernetes, no Terraform/IaC,
# no granted/AWS SSO — add back any of these as your work environment allows.
items:
  - bat
  - blesh
  - delta
  - fd
  - fzf
  - gh
  - glab
  - grok
  - jq
  - just
  - lazygit
  - mise
  - neovim
  - opencode
  - ripgrep
  - starship
  - tmux
  - windows-terminal
  - worktrunk
  - yq

ai:
  default: opencode   # tav/wta/wtc and commit messages; ~/.localrc AI_TOOL wins

models:
  plan:
    grok: { model: us-gov.xai.grok-4.7 }
    opencode: { model: amazon-bedrock-gov/work-grok-4.7, effort: xhigh }
  implement:
    grok: { model: us-gov.xai.grok-4.7 }
    opencode: { model: amazon-bedrock-gov/work-grok-4.7, effort: high }
  review:
    grok: { model: us-gov.xai.grok-4.7 }
    opencode: { model: amazon-bedrock-gov/work-grok-4.7, effort: high }
  small:
    grok: { model: us-gov.xai.grok-4.7 }
    opencode: { model: amazon-bedrock-gov/work-grok-4.7, effort: medium }
  monitor:
    grok: { model: us-gov.xai.grok-4.7 }
    opencode: { model: amazon-bedrock-gov/work-grok-4.7, effort: low }

mcp:
  enable: [context7, firecrawl, kubernetes]
  override:
    # Ubuntu npm 9.2.0 wedges `npx @latest` (ENOTEMPTY leftover rename).
    kubernetes:
      command: kubernetes-mcp-server
