# profiles/macos-personal.yaml
# Personal macOS dev machine. Full dev stack via Homebrew. Linux-specific
# items (hypr, mako, walker, waybar, makima) are excluded
# since they don't apply to Darwin. Adjust to taste.

name: macos-personal
description: Personal macOS (full dev stack via Homebrew)

requires: [darwin]

core_extras:
  - git-submodules
  - git-config
  - ssh-config
  - zsh-config
  - ai-tool

items:
  - 1password-cli
  - alacritty
  - bat
  - btop
  - cargo
  - claude
  - cloc
  - delta
  - docker
  - fd
  - flux
  - flux-operator-mcp
  - fzf
  - gh
  - gitea-mcp
  - granted
  - grok
  - gum
  - helm
  - jq
  - just
  - k9s
  - kubectl
  - lazygit
  - mise
  - neovim
  - npm
  - opencode
  - ripgrep
  - sccache
  - skaffold
  - starship
  - tea
  - terraform
  - tmux
  - uv
  - worktrunk
  - yq

ai:
  default: claude   # tav/wta/wtc and commit messages; ~/.localrc AI_TOOL wins

mcp:
  enable: [aws, context7, firecrawl, flux, gitea, grafana, kubernetes, playwright]
