# Shared Alacritty settings (all platforms).
# Loaded via alacritty.toml imports. Defaults live here so Omarchy
# works even when os.toml is missing (import of missing files is skipped).
# macOS overrides live in os.darwin.toml (imported after this file).

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Single-byte chords: Grok panes in tmux stay VT10x, which strips modifiers
# from CSI-u / S-Enter / C-.. LF is a newline; C-x is Grok's shortcuts fallback.
# Named keys like Quote/Period are invalid in Alacritty — use the character.
{ key = "Return", mods = "Shift", chars = "\n" },
{ key = ".", mods = "Control", chars = "\u0018" },
# CSI-u so tmux can tell these apart from unshifted / unmodded keys.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
{ key = "Return", mods = "Control", chars = "\u001B[13;5u" },
{ key = ";", mods = "Control", chars = "\u001B[59;5u" },
{ key = "'", mods = "Control", chars = "\u001B[39;5u" },
{ key = ",", mods = "Control", chars = "\u001B[44;5u" }
]
