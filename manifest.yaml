# manifest.yaml — universal inventory of every installable item.
# Schema reference: docs/manifest.md
#
# Each top-level key is an item name. The installer reads this file to:
#   1. Discover what items exist (`dot install <name>`, picker, profiles)
#   2. Decide how to install (binary install, stow config, handler function)
#   3. Decide whether it's eligible on the current host (`requires:` predicates)
#
# Items that lack an `install:` block are config-only. Items that lack a
# `config:` block are tool-only. Items with both are bundles — picking them
# installs the binary AND links the config.

1password-cli:
  description: 1Password CLI (op)
  install:
    arch: 1password-cli
    brew: --cask 1password-cli
    script: install-1password-cli.sh
    command: op

alacritty:
  description: GPU-accelerated cross-platform terminal
  install:
    arch: alacritty
    apt: alacritty
    brew: --cask alacritty
    check: apps:Alacritty.app/Contents/MacOS/alacritty
  config:
    type: stow
  post_install: [alacritty_setup]

bat:
  description: Cat with syntax highlighting
  install:
    arch: bat
    brew: bat
    release:
      repo: sharkdp/bat
      asset: bat-{tag}-{arch}.tar.gz
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-musl}

blesh:
  description: Bash autosuggestions + syntax highlighting (ble.sh)
  install:
    script: install-blesh.sh
    check: xdg_data:blesh/ble.sh
  config:
    type: stow
  requires: [linux]

btop:
  description: System resource monitor
  config:
    type: stow

cargo:
  description: Cargo config — wires sccache as the Rust compiler wrapper
  config:
    type: handler
    handler: install_cargo_config

cargo-sweep:
  description: Daily size cap on the shared Athenis Rust build dir (systemd timer)
  install:
    arch: cargo-sweep
  config:
    type: handler
    handler: install_cargo_sweep_timer
  requires: [linux]

claude:
  description: Claude Code CLI + skills, agents, rules, hooks from ai/
  install:
    script: install-claude.sh
  config:
    type: handler
    handler: install_ai_claude
  post_install: [generate_mcp_configs]

cloc:
  description: Count lines of code
  install:
    arch: cloc
    brew: cloc
    release:
      repo: AlDanial/cloc
      asset: cloc-{version}.pl

delta:
  description: Syntax-highlighting pager for git diffs
  install:
    arch: git-delta
    brew: git-delta
    release:
      repo: dandavison/delta
      asset: delta-{version}-{arch}.tar.gz
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-gnu}

docker:
  description: Container platform
  install:
    arch: docker
    apt: docker.io
    brew: --cask docker

fd:
  description: Fast find alternative
  install:
    arch: fd
    brew: fd
    release:
      repo: sharkdp/fd
      asset: fd-{tag}-{arch}.tar.gz
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-musl}

flux:
  description: GitOps toolkit
  install:
    arch: fluxcd
    brew: fluxcd/tap/flux
    script: install-flux.sh

flux-operator-mcp:
  description: Flux MCP server (AI-assisted GitOps for Flux clusters)
  install:
    brew: controlplaneio-fluxcd/tap/flux-operator-mcp
    release:
      repo: controlplaneio-fluxcd/flux-operator
      asset: flux-operator-mcp_{version}_{os}_{arch}.tar.gz
      sums: flux-operator_{version}_checksums.txt
      arch: {x86_64: amd64, aarch64: arm64}

fzf:
  description: Fuzzy finder
  install:
    arch: fzf
    apt: fzf
    brew: fzf
    release:
      repo: junegunn/fzf
      asset: fzf-{version}-{os}_{arch}.tar.gz
      sums: fzf_{version}_checksums.txt
      arch: {x86_64: amd64, aarch64: arm64}

gh:
  description: GitHub CLI
  install:
    arch: github-cli
    brew: gh
    release:
      repo: cli/cli
      asset: gh_{version}_{os}_{arch}.tar.gz
      sums: gh_{version}_checksums.txt
      arch: {x86_64: amd64, aarch64: arm64}

gitea-mcp:
  description: Gitea MCP server (personal Gitea over Netbird)
  install:
    release:
      latest: https://gitea.com/gitea/gitea-mcp/releases/latest
      url: https://gitea.com/gitea/gitea-mcp/releases/download/{tag}/gitea-mcp_{os}_{arch}.tar.gz
      sums: gitea-mcp_{version}_checksums.txt
      os: {linux: Linux, darwin: Darwin}
      arch: {x86_64: x86_64, aarch64: arm64}

glab:
  description: GitLab CLI
  install:
    arch: glab
    brew: glab
    release:
      latest: https://gitlab.com/gitlab-org/cli/-/releases/permalink/latest
      url: https://gitlab.com/gitlab-org/cli/-/releases/{tag}/downloads/glab_{version}_{os}_{arch}.tar.gz
      sums: checksums.txt
      arch: {x86_64: amd64, aarch64: arm64}

granted:
  description: AWS SSO profile switcher with shell env export
  install:
    brew: fwdcloudsec/granted/granted
    release:
      repo: fwdcloudsec/granted
      asset: granted_{version}_{os}_{arch}.tar.gz
      sums: checksums.txt
      bin: [granted, assume, assumego]
      arch: {x86_64: x86_64, aarch64: arm64}

grok:
  description: Grok Build TUI + skills, agents, rules, hooks from ai/
  install:
    script: install-grok.sh
  config:
    type: handler
    handler: install_ai_grok
  post_install: [generate_mcp_configs]

gum:
  description: TUI components for scripts
  install:
    arch: gum
    brew: gum
    script: install-gum.sh

helm:
  description: Kubernetes package manager
  install:
    arch: helm
    brew: helm
    script: install-helm.sh

hypr:
  description: Hyprland personal overlays (binds, monitors, scripts)
  config:
    type: handler
    handler: install_hypr_config
  requires: [hyprland]

jq:
  description: JSON processor
  install:
    arch: jq
    apt: jq
    brew: jq
    dnf: jq

just:
  description: Task runner
  install:
    arch: just
    brew: just
    release:
      repo: casey/just
      asset: just-{version}-{arch}.tar.gz
      sums: SHA256SUMS
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-musl}

k9s:
  description: Kubernetes cluster manager TUI
  install:
    arch: k9s
    brew: derailed/k9s/k9s
    release:
      repo: derailed/k9s
      asset: k9s_{os}_{arch}.tar.gz
      sums: checksums.sha256
      os: {linux: Linux}
      arch: {x86_64: amd64, aarch64: arm64}
  config:
    type: stow

kubectl:
  description: Kubernetes CLI
  install:
    arch: kubectl
    brew: kubectl
    release:
      latest: https://dl.k8s.io/release/stable.txt
      url: https://dl.k8s.io/release/{tag}/bin/{os}/{arch}/kubectl
      sums: '{asset}.sha256'
      arch: {x86_64: amd64, aarch64: arm64}

lazygit:
  description: Terminal UI for git
  install:
    arch: lazygit
    brew: lazygit
    release:
      repo: jesseduffield/lazygit
      asset: lazygit_{version}_{os}_{arch}.tar.gz
      sums: checksums.txt
      arch: {x86_64: x86_64, aarch64: arm64}
  config:
    type: stow

makima:
  description: Key remapping daemon config
  config:
    type: stow
  requires: [linux]

mold:
  description: Fast linker — accelerates Rust/C/C++ link step (Linux only)
  install:
    arch: mold
    apt: mold
  requires: [linux]

mise:
  description: Dev tool version manager
  install:
    arch: mise
    brew: mise
    script: install-mise.sh

neovim:
  description: Hyperextensible text editor
  install:
    arch: neovim
    brew: neovim
    script: install-neovim.sh
    command: nvim
  config:
    type: stow
    package: nvim
  post_install: [install_neovim_extras]

npm:
  description: Node.js package manager
  install:
    arch: npm
    apt: npm
    brew: node

omarchy:
  description: Omarchy personal overlays (themes, branding, bar widget)
  config:
    type: handler
    handler: install_omarchy_config
  requires: [omarchy]

opencode:
  description: OpenCode config + skills, agents, rules from ai/
  config:
    type: stow
  post_install: [install_ai_opencode, generate_mcp_configs]

poetry:
  description: Poetry (optional/legacy; prefer uv for new Python work)
  install:
    arch: python-poetry
    brew: poetry
    script: install-poetry.sh

ripgrep:
  description: Fast grep alternative
  install:
    arch: ripgrep
    apt: ripgrep
    brew: ripgrep
    release:
      repo: BurntSushi/ripgrep
      asset: ripgrep-{version}-{arch}.tar.gz
      sums: '{asset}.sha256'
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-musl}
    command: rg

sccache:
  description: Shared compilation cache (Rust/C/C++) — paired with the cargo config
  install:
    arch: sccache
    brew: sccache

skaffold:
  description: Kubernetes dev workflow
  install:
    arch: skaffold
    brew: skaffold
    release:
      repo: GoogleContainerTools/skaffold
      asset: skaffold-{os}-{arch}
      sums: '{asset}.sha256'
      arch: {x86_64: amd64, aarch64: arm64}

starship:
  description: Cross-shell prompt
  install:
    arch: starship
    brew: starship
    release:
      repo: starship/starship
      asset: starship-{arch}.tar.gz
      sums: '{asset}.sha256'
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-musl}
  config:
    type: stow

tea:
  description: Gitea CLI (personal Gitea over Netbird)
  install:
    arch: tea
    brew: tea
    release:
      latest: https://gitea.com/gitea/tea/releases/latest
      url: https://dl.gitea.com/tea/{version}/tea-{version}-{os}-{arch}
      sums: '{asset}.sha256'
      arch: {x86_64: amd64, aarch64: arm64}
  config:
    type: handler
    handler: install_tea_login

terraform:
  description: Infrastructure as code
  install:
    arch: terraform
    brew: terraform
    release:
      repo: hashicorp/terraform
      url: https://releases.hashicorp.com/terraform/{version}/terraform_{version}_{os}_{arch}.zip
      sums: terraform_{version}_SHA256SUMS
      arch: {x86_64: amd64, aarch64: arm64}

tmux:
  description: Terminal multiplexer
  install:
    arch: tmux
    apt: tmux
    brew: tmux
    dnf: tmux
  config:
    type: stow

superwhisper:
  description: Superwhisper dictation settings (applied through its CLI)
  config:
    type: handler
    handler: install_superwhisper_config
  requires: [linux]

uv:
  description: Fast Python package installer (provides uv + uvx)
  install:
    arch: uv
    brew: uv
    release:
      repo: astral-sh/uv
      asset: uv-{arch}.tar.gz
      sums: '{asset}.sha256'
      bin: [uv, uvx]
      arch: {x86_64: x86_64-unknown-linux-musl, aarch64: aarch64-unknown-linux-musl}

windows-terminal:
  description: Windows Terminal theme + font config (WSL only)
  config:
    type: handler
    handler: install_windows_terminal_config
  requires: [wsl]

# On Linux, ensure_yq (scripts/lib/pkg.sh) installs Go yq from its release
# before this file can be read, so the item needs no release entry.
yq:
  description: YAML processor
  install:
    arch: yq
    brew: yq
