# Grok Build TUI — seed for a missing ~/.grok/config.toml.
# The live file is NOT a symlink: Grok mutates it at runtime. install_ai_grok
# copies this seed only when the live file is absent, then merges
# grok/.grok/base.toml, the profile's MCP servers, and [compat.claude] into
# the live file.
#
# Skills, agents, hooks, and rules live in ~/.dotfiles/ai/ and are symlinked
# into ~/.grok/{skills,agents,hooks,rules}/.

[cli]
auto_update = true

[models]
default = "grok-build"
web_search = "grok-4.20-multi-agent"

[ui]
# Tokyo Night inspired theme (excellent contrast on dark terminals)
theme = "tokyonight"

# Width for reasoning/thinking blocks
max_thoughts_width = 120

# Fork secondary model for parallel exploration (used by some subagents)
fork_secondary_model = "grok-build"

# Permission mode: "ask" | "always-approve" | "never-approve"
# "ask" is the safest default for dotfiles-managed machines
permission_mode = "ask"

# Compact mode reduces prompt padding
compact_mode = false

# YOLO / auto-approve all tool calls (use with extreme caution)
yolo = false

[features]
# Codebase indexing for better project understanding
codebase_indexing = true

# LSP tools (experimental)
lsp_tools = false

# Telemetry and feedback (disabled for privacy)
telemetry = false
feedback = false

[session]
# Auto-compact when context is this full
auto_compact_threshold_percent = 85

# Load .envrc / direnv when present
load_envrc = true

[tools]
# Respect .gitignore for file operations
respect_gitignore = true

# Servers kept off at runtime (toggle with /mcps). generate_mcp_configs takes
# any server the profile enables out of this list.
disabled_mcp_servers = [
    "memory",               # enable explicitly with GROK_MEMORY=1 when desired
]

# Skip the blocking "Do you trust this directory?" modal. Each git worktree is
# a separate workspace, so a parent grant does not cover wtc windows.
[folder_trust]
enabled = false

# ---------------------------------------------------------------------------
# MCP Servers
# ---------------------------------------------------------------------------
# Roster lives in ~/.dotfiles/ai/mcp-servers.json.tpl; the active profile's
# mcp: block picks the servers. generate_mcp_configs rewrites every
# [mcp_servers.*] table on each regen, so tables added here by hand are lost.

# ---------------------------------------------------------------------------
# Subagents
# ---------------------------------------------------------------------------
[subagents]
enabled = true
default_model = "grok-build"

[subagents.toggle]
explore = true
plan = true

# ---------------------------------------------------------------------------
# Memory (cross-session knowledge)
# ---------------------------------------------------------------------------
# Enable with: grok --experimental-memory  or  export GROK_MEMORY=1
[memory]
enabled = false

[memory.session]
save_on_end = true

[memory.initial_injection]
enabled = true

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
# Additional skill directories (beyond ~/.grok/skills/)
# [skills]
# paths = ["~/team-skills"]
# ignore = ["~/team-skills/wip"]

# ---------------------------------------------------------------------------
# Harness compatibility
# ---------------------------------------------------------------------------
# The Claude Code adapter fills ~/.claude from the same ai/ sources. Keep these
# off so Grok doesn't load every skill, rule and hook a second time.
[compat.claude]
skills = false
rules = false
agents = false
mcps = false
hooks = false
sessions = false

# ---------------------------------------------------------------------------
# Plugins / Marketplace (advanced)
# ---------------------------------------------------------------------------
[plugins]
enabled = []
disabled = []

# Example marketplace source:
# [[marketplace.sources]]
# name = "My Team"
# git = "git@github.com:myorg/grok-plugins.git"
