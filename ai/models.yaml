# Model and effort for each job, per harness. Agents that set `job:` in
# ai/agents/*.md run on their job's entry, and `wto new -j <job>` starts a
# session on it. Skills name jobs, never models.
#
# effort is the harness's reasoning level; OpenCode gets it as the model
# variant, so it must be one the provider declares in opencode.json.tpl.
# Omit it to use the model's default.
#
# A profile's `models:` block takes the same shape and replaces an entry for
# one job and harness on that machine. Run `dot update` after editing.

plan:
  claude: { model: opus, effort: xhigh }
  grok: { model: grok-4.7, effort: xhigh }
  opencode: { model: amazon-bedrock/deleon-claude-opus-5.5, effort: xhigh }

implement:
  claude: { model: opus, effort: high }
  grok: { model: grok-4.7, effort: high }
  opencode: { model: amazon-bedrock/deleon-claude-opus-5.5, effort: high }

review:
  claude: { model: opus, effort: high }
  grok: { model: grok-4.7, effort: high }
  opencode: { model: amazon-bedrock/deleon-claude-opus-5.5, effort: high }

# Small, fully specified changes: a known error with an obvious cause, a
# rename, a config change.
small:
  claude: { model: sonnet, effort: medium }
  grok: { model: grok-4.7-build-fast }
  opencode: { model: amazon-bedrock/deleon-claude-sonnet-5.5, effort: medium }
