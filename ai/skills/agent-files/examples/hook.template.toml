# Grok Build hook example, inline in ~/.grok/config.toml. The same object can
# live in a JSON file under ~/.grok/hooks/ (this repo uses ai/hooks/dotfiles.json).
# Scripts in ~/.grok/hooks/ are not registered by their filename.

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type          = "command"
command       = "/home/cdeleon/.dotfiles/ai/hooks/pre_tool_use_bash_safety.sh"
timeout       = 5
statusMessage = "Checking Bash command for safety"

[[hooks.PostToolUse]]
matcher = "Edit|Write"

[[hooks.PostToolUse.hooks]]
type    = "command"
command = "/home/cdeleon/.dotfiles/ai/hooks/post_tool_use_format.sh"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type    = "command"
command = "/home/cdeleon/.dotfiles/ai/hooks/session_start_inject_context.sh"
