# Linked into ~/.config/systemd/user/voxtype.service.d/ by install_voxtype_systemd.
# A deliberate stop or restart ends with result "success" and stays quiet.
[Service]
ExecStopPost=/bin/sh -c '[ "$$SERVICE_RESULT" = success ] || notify-send -a Voxtype "Voxtype daemon crashed" "Result: $$SERVICE_RESULT ($$EXIT_CODE $$EXIT_STATUS). systemd will try to restart it."'
