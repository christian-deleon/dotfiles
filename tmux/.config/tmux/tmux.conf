# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
# Prefix-free splits. tav wraps Grok in bash, so pane_current_command is often
# "bash"; Grok's OSC title ends in "grok". Pass Alt+Enter through as CSI-u so
# Grok's newline fallback is not stolen.
bind -n M-Enter if-shell -F '#{||:#{==:#{pane_current_command},grok},#{||:#{==:#{pane_title},grok},#{m:*- grok,#{pane_title}}}}' "send-keys Escape '[13;3u'" 'split-window -v -c "#{pane_current_path}"'
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
# Grok panes stay VT10x: tmux recognizes S-Enter / C-. (extkeys) then strips
# the modifiers. Intercept and send what Grok actually handles (LF / C-x).
# Windows Terminal also delivers S-Enter as a real key. OpenCode treats that
# as submit, so those panes get C-j too (command, @ai_tool, or an "OC |" /
# "OpenCode" title — tav leaves the command as bash). Alacritty sends a raw
# LF, or CSI-u handled by User0 below, so this key does not fire there.
bind -n S-Enter if-shell -F '#{||:#{||:#{==:#{pane_current_command},grok},#{||:#{==:#{pane_title},grok},#{m:*- grok,#{pane_title}}}},#{||:#{m:opencode*,#{pane_current_command}},#{||:#{==:#{@ai_tool},opencode},#{||:#{==:#{pane_title},OpenCode},#{m:OC |*,#{pane_title}}}}}}' 'send-keys C-j' 'send-keys Enter'
bind -n C-. if-shell -F '#{||:#{==:#{pane_current_command},grok},#{||:#{==:#{pane_title},grok},#{m:*- grok,#{pane_title}}}}' 'send-keys C-x' 'send-keys -l .'
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k confirm-before -p "kill-window #W? (y/n)" kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
# 60x20 fits every project path; shrink on small windows, where tmux refuses an oversized popup.
bind C run-shell -b 'w=#{client_width} h=#{client_height}; tmux display-popup -c "#{client_name}" -E -w $((w < 62 ? w - 2 : 60)) -h $((h < 22 ? h - 2 : 20)) -T " project " ~/.config/tmux/project-popup.sh'
# Popups don't expand formats, so run-shell fills them in; q: keeps the $ in session ids from the shell.
bind s run-shell -b 'w=#{client_width} h=#{client_height}; tmux display-popup -c "#{client_name}" -e "POPUP_SESSION=#{q:session_id}" -e "POPUP_CLIENT=#{client_name}" -E -w $((w < 62 ? w - 2 : 60)) -h $((h < 22 ? h - 2 : 20)) -T " session " ~/.config/tmux/session-popup.sh'
bind K confirm-before -p "kill-session #S? (y/n)" "run-shell \"tmux switch-client -c #{client_name} -n; tmux kill-session -t '#{session_id}'\""
bind W display-popup -E -d "#{pane_current_path}" -w 70% -h 40% -T " wtc " "~/.config/tmux/wtc-popup.sh"
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
# Plain drags on pane borders kept resizing panes by accident; resize with Ctrl+drag.
unbind -n MouseDrag1Border
bind -n C-MouseDrag1Border resize-pane -M
# Session names sit in the status-right list, so a right-click there lands on
# the window menu (tmux's session menu only opens from status-left). Give them a
# session menu at the mouse; windows keep tmux's stock menu, copied from 3.8.
# A menu on another session's pane never opens, so run-shell -C fills in the
# clicked session (the mouse target) and the menu runs on the client's own pane.
# The -- matters: a disabled first item expands to a leading "-", read as a flag.
# No Renumber item: renumber-windows is on.
bind -n MouseDown3Status if -F '#{==:#{mouse_status_range},session}' {
    run-shell -C "display-menu -t '#{client_session}:' -x M -y S -T '#[align=centre]#{session_name}' -- \
        '#{?#{==:#{session_name},#{client_session}},-,}Switch To' s { switch-client -t '#{session_id}' } \
        Rename r { command-prompt -I '#{session_name}' { rename-session -t '#{session_id}' -- '%%' } } \
        '' 'New Session' S { new-session } \
        'New Window' w { new-window -t '#{session_id}:' ; switch-client -t '#{session_id}' } \
        '' Detach d { detach-client }"
} {
    display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
}
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy on
set -g extended-keys on
set -g extended-keys-format csi-u
# Features are applied at client attach. Put extkeys on the same xterm* entry
# tmux ships by default — Alacritty sets TERM=xterm-256color, and tmux's
# extkeys probe is xterm modifyOtherKeys (which Alacritty ignores). Incoming
# CSI-u from alacritty/shared.toml still needs this so tmux parses C-. / S-Enter.
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:extkeys"
set -ag terminal-features "screen*:title"
set -ag terminal-features "rxvt*:ignorefkeys"
set -ag terminal-features "alacritty*:ccolour:cstyle:focus:title:extkeys"

# Grok panes stay in VT10x (they request Kitty protocol, which tmux does not
# promote to Ext 1). In VT10x, recognized C-. / S-Enter lose their modifiers.
# This client also has no extkeys until reattach, so CSI-u is not a real key.
# Match Alacritty's CSI-u bytes as user-keys and inject them literally.
set -s user-keys[0] "\e[13;2u"
set -s user-keys[1] "\e[13;4u"
set -s user-keys[2] "\e[13;5u"
set -s user-keys[3] "\e[46;5u"
set -s user-keys[4] "\e[59;5u"
set -s user-keys[5] "\e[39;5u"
set -s user-keys[6] "\e[44;5u"
bind -n User0 send-keys C-j
bind -n User1 split-window -h -c "#{pane_current_path}"
bind -n User2 send-keys -l "\e[13;5u"
bind -n User3 send-keys C-x
bind -n User4 send-keys -l "\e[59;5u"
bind -n User5 send-keys -l "\e[39;5u"
bind -n User6 send-keys -l "\e[44;5u"

# Status bar
set -g status-position top
set -g status-interval 5
# Room for every session name plus the indicators and host; tmux cuts from the end.
set -g status-right-length 150
set -g window-status-separator ""
set -gw automatic-rename on
# Live branch of the pane's checkout (folder name when detached or outside
# git). The #() result arrives after the first redraw; until then, the folder.
set -gw automatic-rename-format '#{?#(~/.config/tmux/window-label.sh #{q:pane_current_path}),#(~/.config/tmux/window-label.sh #{q:pane_current_path}),#{b:pane_current_path}}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left ""
# Every session, current one in blue; clicking a name switches to it (the stock
# MouseDown1Status binding). Styles sit in separate #[] blocks because a comma
# would end the S: loop's format.
set -g status-right "#{S/n:#[range=session|#{session_id}]#[fg=brightblack] #S #[norange default],#[range=session|#{session_id}]#[fg=black]#[bg=blue]#[bold] #S #[norange default]}  #[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
# tmux redraws a client's status only for changes to its own session, so the
# session list above would show a killed, new or renamed session late, up to
# status-interval. Redraw every client when the session list changes.
set-hook -g session-closed 'run-shell -b "tmux list-clients -F \"##{client_name}\" | xargs -rI{} tmux refresh-client -S -t {}"'
set-hook -g session-created 'run-shell -b "tmux list-clients -F \"##{client_name}\" | xargs -rI{} tmux refresh-client -S -t {}"'
set-hook -g session-renamed 'run-shell -b "tmux list-clients -F \"##{client_name}\" | xargs -rI{} tmux refresh-client -S -t {}"'
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# === Personal additions (managed in ~/.dotfiles/tmux/) ===

# AI-agent "waiting on you" indicator. ai/hooks/{stop,notification}_notify.sh
# set @ai_waiting=1 on the window when a turn ends; UserPromptSubmit clears it.
# Selecting the window clears it too, so it is not session state: `wto ls`
# reads the @ai_state pane option (ai/hooks/session_state.sh) instead.
# Dot renders only on non-current windows (current-format unchanged).
set -g window-status-format "#[fg=brightblack] #I:#W#{?@ai_waiting, #[fg=yellow]●#[default],} "
set-hook -g window-pane-changed 'set-option -wu @ai_waiting'
set-hook -g after-select-window 'set-option -wu @ai_waiting'

# tmux re-runs automatic-rename-format only when the active pane prints, so a
# branch made from an idle or unfocused pane never reaches the window name.
# Setting the option flags every window for a recheck; the status redraw does
# it each status-interval, and the second pass picks up the #() label.
set -ga status-right '#(tmux set -gw automatic-rename on)'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
